; Kido Clock - ESP32-C3 SuperMini + round 1.28" GC9A01 240x240 TFT
[platformio]
name = kido-clock
description = Kido Clock - a sleep-training clock for kids (ESP32-C3 + round GC9A01 TFT)
default_envs = esp32c3

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; 4 MB, no OTA: 3 MB app (firmware + colour icons), 960 KB LittleFS (see the file)
board_build.partitions = partitions_4mb_noota.csv
extra_scripts = pre:tools/gen_assets.py
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.7
    bblanchon/ArduinoJson @ ^7.2.0
    tzapu/WiFiManager @ ^2.0.17

; ESP32-C3 SuperMini (4 MB flash, native USB-C) + GC9A01 (default)
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_C3_SUPERMINI=1
    ; SuperMini antennas often fail to associate at full power; cap TX power (see README)
    -D KIDO_WIFI_TX_POWER=WIFI_POWER_8_5dBm

; Any ESP32-S3 devkit + GC9A01 (pin map in src/board_pins.h)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
; the partition table needs only 4 MB, so any S3 module (4, 8 or 16 MB) works
board_upload.flash_size = 4MB
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_S3_DEVKIT=1

; Alternative panel: 2.0" ST7789 240x320 with BL pin on GPIO3 (hardware PWM dimming)
[env:esp32c3_st7789]
extends = env:esp32c3
build_flags =
    ${env:esp32c3.build_flags}
    -D PANEL_ST7789=1
